services:
  browser-ai-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: browser-ai-relay
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      API_PORT: "8000"
      DISPLAY: ":99"
      DISPLAY_WIDTH: "1366"
      DISPLAY_HEIGHT: "768"
      DISPLAY_DEPTH: "24"
      BROWSER_PROFILE_DIR: "/app/browser_data"
      DEBUG_DIR: "/app/logs/debug"
    ports:
      - "${API_PORT:-8000}:8000"
      - "${NOVNC_PORT:-6080}:6080"
    volumes:
      - ./browser_data:/app/browser_data
      - ./logs:/app/logs
    shm_size: "2gb"
    security_opt:
      - seccomp=unconfined
